name: webp_studio
description: PNG to WebP desktop batch converter.
publish_to: none
version: 0.1.3+4
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  desktop_drop: ^0.7.0
  file_selector: ^1.1.0
  image: ^4.5.4
  path: ^1.9.1
  webp_engine:
    path: packages/webp_engine
dev_dependencies:
  file_selector_platform_interface: ^2.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/libwebp.txt
